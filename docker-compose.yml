version: "3.8"

services:
  mongodb:
    image: mongo:7.0
    container_name: p2i-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: p2i_saas

  redis:
    image: redis:7.2-alpine
    container_name: p2i-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: p2i-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: p2i-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: development
      MONGODB_URI: mongodb://mongodb:27017/p2i_saas
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QDRANT_URL: http://qdrant:6333
      STORAGE_PROVIDER: mock
      VECTOR_PROVIDER: mock
      LLM_PROVIDER: mock
      DOCUMENT_AI_PROVIDER: mock
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      - mongodb
      - redis
      - qdrant

volumes:
  mongo_data:
  qdrant_data:
